name: BookMyHall CD

on:
  workflow_run:
    workflows:
      - "BookMyHall CI"
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:

  # ============================================================
  # DEPLOY ONLY WHEN CI SUCCEEDS
  # ============================================================

  deploy:

    name: Deploy BookMyHall to IIS

    if: >
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' }}

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:

      # ========================================================
      # 1. SHOW DEPLOYMENT ENVIRONMENT
      # ========================================================

      - name: Show deployment environment
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "BookMyHall CD Deployment"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "User:"
          Write-Host $env:USERNAME

          Write-Host ""
          Write-Host "GitHub Repository:"
          Write-Host "${{ github.repository }}"

          Write-Host ""
          Write-Host "CI Workflow Run ID:"
          Write-Host "${{ github.event.workflow_run.id }}"

          Write-Host ""
          Write-Host "CI Commit SHA:"
          Write-Host "${{ github.event.workflow_run.head_sha }}"

          Write-Host ""
          Write-Host "======================================"


      # ========================================================
      # 2. DOWNLOAD CI ARTIFACT
      # ========================================================

      - name: Download CI artifact
        uses: actions/download-artifact@v5
        with:
          name: BookMyHall-publish
          path: ${{ github.workspace }}/artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}


      # ========================================================
      # 3. SHOW DOWNLOADED ARTIFACT
      # ========================================================

      - name: Show downloaded artifact
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "Downloaded CI Artifact"
          Write-Host "======================================"

          $artifactPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifact"

          Write-Host ""
          Write-Host "Artifact Path:"
          Write-Host $artifactPath

          if (-not (Test-Path $artifactPath)) {
              throw "Artifact directory does not exist: $artifactPath"
          }

          Write-Host ""
          Write-Host "Artifact Files:"

          Get-ChildItem `
            $artifactPath `
            -Recurse |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "Artifact downloaded successfully."


      # ========================================================
      # 4. VERIFY ARTIFACT
      # ========================================================

      - name: Verify deployment artifact
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "Verifying Deployment Artifact"
          Write-Host "======================================"

          $artifactPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifact"

          if (-not (Test-Path $artifactPath)) {
              throw "Artifact path does not exist: $artifactPath"
          }

          $requiredFiles = @(
              "BookMyHall.Api.dll",
              "BookMyHall.Api.exe",
              "web.config",
              "appsettings.json"
          )

          foreach ($file in $requiredFiles) {

              $filePath = Join-Path `
                $artifactPath `
                $file

              Write-Host ""
              Write-Host "Checking:"
              Write-Host $filePath

              if (-not (Test-Path $filePath)) {
                  throw "Required deployment file not found: $file"
              }

              Write-Host "Verified: $file"
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Artifact verification successful"
          Write-Host "======================================"


      # ========================================================
      # 5. DEFINE RELEASE
      # ========================================================

      - name: Prepare release
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "Preparing BookMyHall Release"
          Write-Host "======================================"

          $releaseRoot = "C:\Websites\BookMyHall\releases"

          $releaseName = "release-${{ github.event.workflow_run.id }}"

          $releasePath = Join-Path `
            $releaseRoot `
            $releaseName

          Write-Host ""
          Write-Host "Release Root:"
          Write-Host $releaseRoot

          Write-Host ""
          Write-Host "Release Name:"
          Write-Host $releaseName

          Write-Host ""
          Write-Host "Release Path:"
          Write-Host $releasePath

          # Create release root if required

          if (-not (Test-Path $releaseRoot)) {

              Write-Host ""
              Write-Host "Creating release root..."

              New-Item `
                -ItemType Directory `
                -Path $releaseRoot `
                -Force | Out-Null
          }

          # Remove release if it already exists

          if (Test-Path $releasePath) {

              Write-Host ""
              Write-Host "Release already exists."
              Write-Host "Removing existing release..."

              Remove-Item `
                $releasePath `
                -Recurse `
                -Force
          }

          # Create new release directory

          New-Item `
            -ItemType Directory `
            -Path $releasePath `
            -Force | Out-Null

          Write-Host ""
          Write-Host "Release directory created successfully."


      # ========================================================
      # 6. COPY APPLICATION FILES
      # ========================================================

      - name: Deploy application files
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "Deploying BookMyHall Application"
          Write-Host "======================================"

          $artifactPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifact"

          $releaseRoot = "C:\Websites\BookMyHall\releases"

          $releaseName = "release-${{ github.event.workflow_run.id }}"

          $releasePath = Join-Path `
            $releaseRoot `
            $releaseName

          Write-Host ""
          Write-Host "Source:"
          Write-Host $artifactPath

          Write-Host ""
          Write-Host "Destination:"
          Write-Host $releasePath

          if (-not (Test-Path $artifactPath)) {
              throw "Artifact path does not exist."
          }

          if (-not (Test-Path $releasePath)) {
              throw "Release path does not exist."
          }

          Copy-Item `
            "$artifactPath\*" `
            $releasePath `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "Application files copied successfully."

          Write-Host ""
          Write-Host "Release files:"

          Get-ChildItem `
            $releasePath `
            -Recurse |
            Select-Object FullName, Length


      # ========================================================
      # 7. VERIFY IIS
      # ========================================================

      - name: Verify IIS configuration
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "Checking IIS Configuration"
          Write-Host "======================================"

          Import-Module WebAdministration

          # ----------------------------------------------------
          # Check website
          # ----------------------------------------------------

          $website = Get-Website `
            -Name "BookMyHall" `
            -ErrorAction SilentlyContinue

          if ($null -eq $website) {
              throw "IIS website 'BookMyHall' does not exist."
          }

          # ----------------------------------------------------
          # Check application pool
          # ----------------------------------------------------

          $appPool = Get-WebAppPoolState `
            -Name "BookMyHallAppPool" `
            -ErrorAction SilentlyContinue

          if ($null -eq $appPool) {
              throw "IIS application pool 'BookMyHallAppPool' does not exist."
          }

          Write-Host ""
          Write-Host "Website:"
          Write-Host $website.Name

          Write-Host ""
          Write-Host "Website State:"
          Write-Host $website.State

          Write-Host ""
          Write-Host "Current Physical Path:"
          Write-Host $website.PhysicalPath

          Write-Host ""
          Write-Host "Application Pool:"
          Write-Host "BookMyHallAppPool"

          Write-Host ""
          Write-Host "Application Pool State:"
          Write-Host $appPool.Value

          Write-Host ""
          Write-Host "IIS configuration verified successfully."


      # ========================================================
      # 8. STOP APPLICATION POOL
      # ========================================================

      - name: Stop BookMyHall AppPool
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "Stopping BookMyHall AppPool"
          Write-Host "======================================"

          Import-Module WebAdministration

          $state = Get-WebAppPoolState `
            -Name "BookMyHallAppPool"

          Write-Host ""
          Write-Host "Current AppPool State:"
          Write-Host $state.Value

          if ($state.Value -eq "Started") {

              Write-Host ""
              Write-Host "Stopping AppPool..."

              Stop-WebAppPool `
                -Name "BookMyHallAppPool"

              Start-Sleep `
                -Seconds 3
          }

          $newState = Get-WebAppPoolState `
            -Name "BookMyHallAppPool"

          Write-Host ""
          Write-Host "AppPool State After Stop:"
          Write-Host $newState.Value

          Write-Host ""
          Write-Host "AppPool stop operation completed."


      # ========================================================
      # 9. SWITCH IIS TO NEW RELEASE
      # ========================================================

      - name: Switch IIS to new release
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "Switching IIS to New Release"
          Write-Host "======================================"

          Import-Module WebAdministration

          $releaseRoot = "C:\Websites\BookMyHall\releases"

          $releaseName = "release-${{ github.event.workflow_run.id }}"

          $releasePath = Join-Path `
            $releaseRoot `
            $releaseName

          Write-Host ""
          Write-Host "New Release:"
          Write-Host $releaseName

          Write-Host ""
          Write-Host "New IIS Physical Path:"
          Write-Host $releasePath

          if (-not (Test-Path $releasePath)) {
              throw "Release path does not exist: $releasePath"
          }

          # Verify required files before changing IIS

          $webConfig = Join-Path `
            $releasePath `
            "web.config"

          $apiDll = Join-Path `
            $releasePath `
            "BookMyHall.Api.dll"

          if (-not (Test-Path $webConfig)) {
              throw "web.config not found in release."
          }

          if (-not (Test-Path $apiDll)) {
              throw "BookMyHall.Api.dll not found in release."
          }

          # Change IIS physical path

          Set-ItemProperty `
            "IIS:\Sites\BookMyHall" `
            -Name physicalPath `
            -Value $releasePath

          Write-Host ""
          Write-Host "IIS physical path updated successfully."


      # ========================================================
      # 10. START APPLICATION POOL
      # ========================================================

      - name: Start BookMyHall AppPool
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "Starting BookMyHall AppPool"
          Write-Host "======================================"

          Import-Module WebAdministration

          Start-WebAppPool `
            -Name "BookMyHallAppPool"

          Start-Sleep `
            -Seconds 5

          $state = Get-WebAppPoolState `
            -Name "BookMyHallAppPool"

          Write-Host ""
          Write-Host "AppPool State:"
          Write-Host $state.Value

          if ($state.Value -ne "Started") {
              throw "BookMyHall AppPool failed to start."
          }

          Write-Host ""
          Write-Host "BookMyHall AppPool started successfully."


      # ========================================================
      # 11. VERIFY IIS PHYSICAL PATH
      # ========================================================

      - name: Verify IIS deployment
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "Verifying IIS Deployment"
          Write-Host "======================================"

          Import-Module WebAdministration

          $site = Get-Website `
            -Name "BookMyHall"

          $expectedPath = Join-Path `
            "C:\Websites\BookMyHall\releases" `
            "release-${{ github.event.workflow_run.id }}"

          Write-Host ""
          Write-Host "Expected IIS Path:"
          Write-Host $expectedPath

          Write-Host ""
          Write-Host "Actual IIS Path:"
          Write-Host $site.PhysicalPath

          if ($site.PhysicalPath.TrimEnd('\') -ne $expectedPath.TrimEnd('\')) {
              throw "IIS physical path does not match deployed release."
          }

          Write-Host ""
          Write-Host "IIS physical path verification successful."


      # ========================================================
      # 12. HEALTH CHECK
      # ========================================================

      - name: Health check
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "BookMyHall Health Check"
          Write-Host "======================================"

          $healthUrl = "http://127.0.0.1:8065/health"

          Write-Host ""
          Write-Host "Health URL:"
          Write-Host $healthUrl

          $success = $false

          for ($i = 1; $i -le 12; $i++) {

              Write-Host ""
              Write-Host "Health check attempt $i of 12..."

              try {

                  $response = Invoke-WebRequest `
                    -Uri $healthUrl `
                    -UseBasicParsing `
                    -TimeoutSec 10

                  Write-Host ""
                  Write-Host "HTTP Status:"
                  Write-Host $response.StatusCode

                  if ($response.StatusCode -eq 200) {

                      Write-Host ""
                      Write-Host "Health check successful."

                      $success = $true

                      break
                  }
              }
              catch {

                  Write-Host ""
                  Write-Host "Application not ready yet."

                  Write-Host $_.Exception.Message
              }

              Start-Sleep `
                -Seconds 5
          }

          if (-not $success) {
              throw "BookMyHall health check failed."
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "BookMyHall is healthy"
          Write-Host "======================================"


      # ========================================================
      # 13. CLEAN OLD RELEASES
      # ========================================================

      - name: Cleanup old releases
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "Cleaning Old Releases"
          Write-Host "======================================"

          $releaseRoot = "C:\Websites\BookMyHall\releases"

          $currentRelease = "release-${{ github.event.workflow_run.id }}"

          $keep = 5

          if (-not (Test-Path $releaseRoot)) {

              Write-Host ""
              Write-Host "Release root does not exist."

              exit 0
          }

          $releases = Get-ChildItem `
            $releaseRoot `
            -Directory |
            Where-Object {
                $_.Name -like "release-*"
            } |
            Sort-Object CreationTime -Descending

          Write-Host ""
          Write-Host "Total release folders:"
          Write-Host $releases.Count

          Write-Host ""
          Write-Host "Current release:"
          Write-Host $currentRelease

          if ($releases.Count -gt $keep) {

              $oldReleases = $releases |
                Select-Object -Skip $keep

              foreach ($release in $oldReleases) {

                  # Never delete current release

                  if ($release.Name -eq $currentRelease) {

                      Write-Host ""
                      Write-Host "Skipping current release:"
                      Write-Host $release.FullName

                      continue
                  }

                  Write-Host ""
                  Write-Host "Removing old release:"
                  Write-Host $release.FullName

                  Remove-Item `
                    $release.FullName `
                    -Recurse `
                    -Force
              }
          }

          Write-Host ""
          Write-Host "Release cleanup completed."


      # ========================================================
      # 14. FINAL DEPLOYMENT SUMMARY
      # ========================================================

      - name: Deployment summary
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "BOOKMYHALL CD SUCCESS"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Application:"
          Write-Host "BookMyHall"

          Write-Host ""
          Write-Host "CI Run:"
          Write-Host "${{ github.event.workflow_run.id }}"

          Write-Host ""
          Write-Host "Release:"
          Write-Host "release-${{ github.event.workflow_run.id }}"

          Write-Host ""
          Write-Host "IIS Site:"
          Write-Host "BookMyHall"

          Write-Host ""
          Write-Host "Application Pool:"
          Write-Host "BookMyHallAppPool"

          Write-Host ""
          Write-Host "IIS Port:"
          Write-Host "8065"

          Write-Host ""
          Write-Host "Deployment Status:"
          Write-Host "SUCCESS"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "BookMyHall deployment completed."
          Write-Host "======================================"