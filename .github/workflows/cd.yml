name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    permissions:
      actions: read
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: BookMyHall
          path: publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify artifact
        shell: powershell
        run: |
          Write-Host "Downloaded files:"
          Get-ChildItem ".\publish" -Recurse

      - name: Deploy
        shell: powershell
        run: |
          $release = "C:\Websites\BookMyHall\releases\$(Get-Date -Format yyyyMMdd-HHmmss)"

          Write-Host "Creating release directory: $release"

          New-Item -ItemType Directory -Force -Path $release

          Copy-Item ".\publish\*" $release -Recurse -Force

          if (Test-Path "C:\Websites\BookMyHall\current") {
              Remove-Item "C:\Websites\BookMyHall\current" -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path "C:\Websites\BookMyHall\current"

          Copy-Item "$release\*" "C:\Websites\BookMyHall\current" -Recurse -Force

          Write-Host "Restarting BookMyHall service..."

          Restart-Service "BookMyHall"

          Write-Host "Deployment completed successfully."