name: BookMyHall CD

on:
  workflow_run:
    workflows:
      - "BookMyHall CI"
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:

  # ============================================================
  # DEPLOY ONLY AFTER SUCCESSFUL PUSH CI
  # ============================================================
  deploy:

    name: Deploy BookMyHall to IIS

    if: >
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' }}

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:

      # ==========================================================
      # 1. SHOW DEPLOYMENT INFORMATION
      # ==========================================================
      - name: Show deployment environment
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "BookMyHall CD Deployment"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "User:"
          Write-Host $env:USERNAME

          Write-Host ""
          Write-Host "Repository:"
          Write-Host "${{ github.repository }}"

          Write-Host ""
          Write-Host "CI Workflow Run ID:"
          Write-Host "${{ github.event.workflow_run.id }}"

          Write-Host ""
          Write-Host "CI Commit SHA:"
          Write-Host "${{ github.event.workflow_run.head_sha }}"

          Write-Host ""
          Write-Host "CI Conclusion:"
          Write-Host "${{ github.event.workflow_run.conclusion }}"

          Write-Host ""
          Write-Host "CI Event:"
          Write-Host "${{ github.event.workflow_run.event }}"

          Write-Host ""
          Write-Host "======================================"

      # ==========================================================
      # 2. DOWNLOAD ARTIFACT FROM EXACT CI RUN
      # ==========================================================
      - name: Download BookMyHall CI artifact
        uses: actions/download-artifact@v5
        with:
          name: BookMyHall-publish
          path: ${{ github.workspace }}\artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # ==========================================================
      # 3. VERIFY DOWNLOADED ARTIFACT
      # ==========================================================
      - name: Verify deployment artifact
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Verifying Deployment Artifact"
          Write-Host "======================================"

          $artifactPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifact"

          Write-Host ""
          Write-Host "Artifact Path:"
          Write-Host $artifactPath

          if (-not (Test-Path $artifactPath)) {
              throw "Artifact directory does not exist."
          }

          $apiDll = Join-Path `
            $artifactPath `
            "BookMyHall.Api.dll"

          $webConfig = Join-Path `
            $artifactPath `
            "web.config"

          $appSettings = Join-Path `
            $artifactPath `
            "appsettings.json"

          if (-not (Test-Path $apiDll)) {
              throw "BookMyHall.Api.dll not found."
          }

          if (-not (Test-Path $webConfig)) {
              throw "web.config not found."
          }

          if (-not (Test-Path $appSettings)) {
              throw "appsettings.json not found."
          }

          Write-Host ""
          Write-Host "Required files verified successfully."

          Write-Host ""
          Write-Host "Downloaded files:"

          Get-ChildItem `
            $artifactPath `
            -Recurse |
            Select-Object FullName, Length

      # ==========================================================
      # 4. PREPARE RELEASE
      # ==========================================================
      - name: Prepare release
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Preparing BookMyHall Release"
          Write-Host "======================================"

          $releaseRoot = "C:\Websites\BookMyHall\releases"

          $runId = "${{ github.event.workflow_run.id }}"

          $releaseName = "release-$runId"

          $releasePath = Join-Path `
            $releaseRoot `
            $releaseName

          Write-Host ""
          Write-Host "Release Root:"
          Write-Host $releaseRoot

          Write-Host ""
          Write-Host "Release Name:"
          Write-Host $releaseName

          Write-Host ""
          Write-Host "Release Path:"
          Write-Host $releasePath

          if (-not (Test-Path $releaseRoot)) {

              Write-Host ""
              Write-Host "Creating release root..."

              New-Item `
                -ItemType Directory `
                -Path $releaseRoot `
                -Force | Out-Null
          }

          if (Test-Path $releasePath) {

              Write-Host ""
              Write-Host "Release already exists."

              Write-Host "Removing old release..."

              Remove-Item `
                $releasePath `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $releasePath `
            -Force | Out-Null

          Write-Host ""
          Write-Host "Release directory created successfully."

      # ==========================================================
      # 5. COPY APPLICATION FILES
      # ==========================================================
      - name: Deploy application files
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Deploying BookMyHall Application"
          Write-Host "======================================"

          $artifactPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifact"

          $releaseRoot = "C:\Websites\BookMyHall\releases"

          $runId = "${{ github.event.workflow_run.id }}"

          $releaseName = "release-$runId"

          $releasePath = Join-Path `
            $releaseRoot `
            $releaseName

          Write-Host ""
          Write-Host "Source:"
          Write-Host $artifactPath

          Write-Host ""
          Write-Host "Destination:"
          Write-Host $releasePath

          if (-not (Test-Path $artifactPath)) {
              throw "Artifact path does not exist."
          }

          if (-not (Test-Path $releasePath)) {
              throw "Release path does not exist."
          }

          Copy-Item `
            "$artifactPath\*" `
            $releasePath `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "Application files copied successfully."

          Write-Host ""
          Write-Host "Release files:"

          Get-ChildItem `
            $releasePath `
            -Recurse |
            Select-Object FullName, Length

      # ==========================================================
      # 6. VERIFY IIS CONFIGURATION
      # ==========================================================
      - name: Verify IIS configuration
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Checking IIS Configuration"
          Write-Host "======================================"

          Import-Module WebAdministration

          $website = Get-Website `
            -Name "BookMyHall" `
            -ErrorAction SilentlyContinue

          if ($null -eq $website) {
              throw "IIS website 'BookMyHall' does not exist."
          }

          $appPool = Get-WebAppPoolState `
            -Name "BookMyHallAppPool" `
            -ErrorAction SilentlyContinue

          if ($null -eq $appPool) {
              throw "IIS application pool 'BookMyHallAppPool' does not exist."
          }

          Write-Host ""
          Write-Host "Website:"
          Write-Host $website.Name

          Write-Host ""
          Write-Host "Current Physical Path:"
          Write-Host $website.PhysicalPath

          Write-Host ""
          Write-Host "Application Pool:"
          Write-Host "BookMyHallAppPool"

          Write-Host ""
          Write-Host "IIS configuration verified."

      # ==========================================================
      # 7. STOP APPLICATION POOL
      # ==========================================================
      - name: Stop BookMyHall AppPool
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Stopping BookMyHall AppPool"
          Write-Host "======================================"

          Import-Module WebAdministration

          $state = Get-WebAppPoolState `
            -Name "BookMyHallAppPool"

          Write-Host ""
          Write-Host "Current AppPool State:"
          Write-Host $state.Value

          if ($state.Value -eq "Started") {

              Write-Host ""
              Write-Host "Stopping AppPool..."

              Stop-WebAppPool `
                -Name "BookMyHallAppPool"

              Start-Sleep `
                -Seconds 3
          }

          Write-Host ""
          Write-Host "AppPool stopped."

      # ==========================================================
      # 8. SWITCH IIS TO NEW RELEASE
      # ==========================================================
      - name: Switch IIS to new release
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Switching IIS to New Release"
          Write-Host "======================================"

          Import-Module WebAdministration

          $releaseRoot = "C:\Websites\BookMyHall\releases"

          $runId = "${{ github.event.workflow_run.id }}"

          $releaseName = "release-$runId"

          $releasePath = Join-Path `
            $releaseRoot `
            $releaseName

          Write-Host ""
          Write-Host "New Release:"
          Write-Host $releaseName

          Write-Host ""
          Write-Host "New IIS Physical Path:"
          Write-Host $releasePath

          if (-not (Test-Path $releasePath)) {
              throw "Release path does not exist: $releasePath"
          }

          Set-ItemProperty `
            "IIS:\Sites\BookMyHall" `
            -Name physicalPath `
            -Value $releasePath

          Write-Host ""
          Write-Host "IIS physical path updated successfully."

      # ==========================================================
      # 9. START APP POOL
      # ==========================================================
      - name: Start BookMyHall AppPool
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Starting BookMyHall AppPool"
          Write-Host "======================================"

          Import-Module WebAdministration

          Start-WebAppPool `
            -Name "BookMyHallAppPool"

          Start-Sleep `
            -Seconds 5

          $state = Get-WebAppPoolState `
            -Name "BookMyHallAppPool"

          Write-Host ""
          Write-Host "AppPool State:"
          Write-Host $state.Value

          if ($state.Value -ne "Started") {
              throw "BookMyHall AppPool failed to start."
          }

          Write-Host ""
          Write-Host "AppPool started successfully."

      # ==========================================================
      # 10. START IIS WEBSITE IF REQUIRED
      # ==========================================================
      - name: Start BookMyHall IIS website
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Starting IIS Website"
          Write-Host "======================================"

          Import-Module WebAdministration

          $site = Get-Website `
            -Name "BookMyHall"

          if ($site.State -ne "Started") {

              Write-Host ""
              Write-Host "Website is not started."

              Start-Website `
                -Name "BookMyHall"
          }

          Start-Sleep `
            -Seconds 2

          $site = Get-Website `
            -Name "BookMyHall"

          Write-Host ""
          Write-Host "Website State:"
          Write-Host $site.State

          if ($site.State -ne "Started") {
              throw "BookMyHall IIS website failed to start."
          }

      # ==========================================================
      # 11. VERIFY IIS PHYSICAL PATH
      # ==========================================================
      - name: Verify IIS deployment
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Verifying IIS Deployment"
          Write-Host "======================================"

          Import-Module WebAdministration

          $runId = "${{ github.event.workflow_run.id }}"

          $expectedPath = Join-Path `
            "C:\Websites\BookMyHall\releases" `
            "release-$runId"

          $site = Get-Website `
            -Name "BookMyHall"

          Write-Host ""
          Write-Host "Expected:"
          Write-Host $expectedPath

          Write-Host ""
          Write-Host "Actual:"
          Write-Host $site.PhysicalPath

          $actualPath = [System.IO.Path]::GetFullPath(
            $site.PhysicalPath
          ).TrimEnd('\')

          $expectedNormalized = [System.IO.Path]::GetFullPath(
            $expectedPath
          ).TrimEnd('\')

          if ($actualPath -ine $expectedNormalized) {
              throw "IIS physical path does not match deployed release."
          }

          Write-Host ""
          Write-Host "IIS deployment verified successfully."

      # ==========================================================
      # 12. HEALTH CHECK
      # ==========================================================
      - name: Health check
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "BookMyHall Health Check"
          Write-Host "======================================"

          $healthUrl = "http://127.0.0.1:8065/health"

          Write-Host ""
          Write-Host "Health URL:"
          Write-Host $healthUrl

          $success = $false

          for ($i = 1; $i -le 12; $i++) {

              Write-Host ""
              Write-Host "Health check attempt $i of 12..."

              try {

                  $response = Invoke-WebRequest `
                    -Uri $healthUrl `
                    -UseBasicParsing `
                    -TimeoutSec 10

                  Write-Host ""
                  Write-Host "HTTP Status:"
                  Write-Host $response.StatusCode

                  if ($response.StatusCode -eq 200) {

                      Write-Host ""
                      Write-Host "Health check successful."

                      $success = $true

                      break
                  }
              }
              catch {

                  Write-Host ""
                  Write-Host "Application not ready yet."

                  Write-Host $_.Exception.Message
              }

              Start-Sleep `
                -Seconds 5
          }

          if (-not $success) {
              throw "BookMyHall health check failed."
          }

      # ==========================================================
      # 13. CLEAN OLD RELEASES
      # ==========================================================
      - name: Cleanup old releases
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Cleaning Old Releases"
          Write-Host "======================================"

          $releaseRoot = "C:\Websites\BookMyHall\releases"

          $currentRunId = "${{ github.event.workflow_run.id }}"

          $currentRelease = "release-$currentRunId"

          $keep = 5

          $releases = Get-ChildItem `
            $releaseRoot `
            -Directory `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -like "release-*"
            } |
            Sort-Object CreationTime -Descending

          Write-Host ""
          Write-Host "Total releases:"
          Write-Host $releases.Count

          Write-Host ""
          Write-Host "Current release:"
          Write-Host $currentRelease

          if ($releases.Count -gt $keep) {

              $oldReleases = $releases |
                Where-Object {
                  $_.Name -ne $currentRelease
                } |
                Select-Object -Skip ($keep - 1)

              foreach ($release in $oldReleases) {

                  Write-Host ""
                  Write-Host "Removing:"
                  Write-Host $release.FullName

                  Remove-Item `
                    $release.FullName `
                    -Recurse `
                    -Force
              }
          }

          Write-Host ""
          Write-Host "Release cleanup completed."

      # ==========================================================
      # 14. FINAL DEPLOYMENT SUMMARY
      # ==========================================================
      - name: Deployment summary
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "BOOKMYHALL CD SUCCESS"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Application:"
          Write-Host "BookMyHall"

          Write-Host ""
          Write-Host "CI Run:"
          Write-Host "${{ github.event.workflow_run.id }}"

          Write-Host ""
          Write-Host "Release:"
          Write-Host "release-${{ github.event.workflow_run.id }}"

          Write-Host ""
          Write-Host "IIS Site:"
          Write-Host "BookMyHall"

          Write-Host ""
          Write-Host "App Pool:"
          Write-Host "BookMyHallAppPool"

          Write-Host ""
          Write-Host "Deployment Path:"
          Write-Host "C:\Websites\BookMyHall\releases\release-${{ github.event.workflow_run.id }}"

          Write-Host ""
          Write-Host "Status:"
          Write-Host "DEPLOYMENT SUCCESSFUL"

          Write-Host ""
          Write-Host "======================================"

