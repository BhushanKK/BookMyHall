name: BookMyHall CD

on:
  workflow_run:
    workflows:
      - "BookMyHall CI"
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:

  # ============================================================
  # DEPLOY ONLY AFTER SUCCESSFUL CI PUSH TO MAIN
  # ============================================================
  deploy:

    name: Deploy BookMyHall to IIS

    if: >
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:

      # ============================================================
      # 1. SHOW DEPLOYMENT INFORMATION
      # ============================================================
      - name: Show deployment environment
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "BookMyHall CD Deployment"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "User:"
          Write-Host $env:USERNAME

          Write-Host ""
          Write-Host "CI Workflow Run ID:"
          Write-Host "${{ github.event.workflow_run.id }}"

          Write-Host ""
          Write-Host "CI Commit:"
          Write-Host "${{ github.event.workflow_run.head_sha }}"

          Write-Host ""
          Write-Host "CI Branch:"
          Write-Host "${{ github.event.workflow_run.head_branch }}"

          Write-Host ""
          Write-Host "CI Conclusion:"
          Write-Host "${{ github.event.workflow_run.conclusion }}"

          Write-Host ""
          Write-Host "======================================"

      # ============================================================
      # DEBUG: list artifacts for CI run (helps diagnose missing artifact)
      # ============================================================
      - name: "Debug: list artifacts for CI run"
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "======================================"
          Write-Host "Listing artifacts for CI run"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "CI Run ID: ${{ github.event.workflow_run.id }}"
          $uri = "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts"
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; 'User-Agent' = 'github-actions' }
          try {
              $response = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
              if ($null -eq $response.artifacts -or $response.artifacts.Count -eq 0) {
                  Write-Host "No artifacts found for this run."
              } else {
                  $response.artifacts | ForEach-Object { Write-Host "Artifact: $($_.name) - Size: $($_.size_in_bytes)" }
              }
          } catch {
              Write-Host "Failed to list artifacts: $($_.Exception.Message)"
          }

      # ============================================================
      # 2. DOWNLOAD ARTIFACT FROM CI RUN
      # ============================================================
      - name: Download CI artifact
        uses: actions/download-artifact@v4
        with:
          name: BookMyHall-publish
          path: ${{ runner.temp }}/BookMyHall-publish
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 3. VERIFY DOWNLOADED ARTIFACT (recursive search)
      # ============================================================
      - name: Verify downloaded artifact
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Verifying CI Artifact"
          Write-Host "======================================"

          $artifactPath = Join-Path $env:RUNNER_TEMP "BookMyHall-publish"

          Write-Host ""
          Write-Host "Artifact path:"
          Write-Host $artifactPath

          if (-not (Test-Path $artifactPath)) {
              throw "Artifact directory does not exist: $artifactPath"
          }

          Write-Host ""
          Write-Host "Artifact contents:"
          Get-ChildItem $artifactPath -Recurse | Select-Object FullName, Length | ForEach-Object { Write-Host "$($_.FullName) ($($_.Length) bytes)" }

          $requiredFiles = @(
              "BookMyHall.Api.dll",
              "BookMyHall.Api.exe",
              "web.config",
              "appsettings.json"
          )

          # Get all files under artifact directory and match by file name
          $allFiles = Get-ChildItem $artifactPath -Recurse -File

          foreach ($fileName in $requiredFiles) {
              $found = $allFiles | Where-Object { $_.Name -eq $fileName }
              if (-not $found) {
                  throw "Required artifact file missing: $fileName"
              } else {
                  Write-Host "Verified: $($found.FullName)"
              }
          }

          Write-Host ""
          Write-Host "Artifact verification successful."

      # ============================================================
      # 4. PREPARE RELEASE
      # ============================================================
      - name: Prepare release
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Preparing Release"
          Write-Host "======================================"

          $releaseRoot = "C:\Websites\BookMyHall\releases"

          $runId = "${{ github.event.workflow_run.id }}"

          $releaseName = "release-$runId"

          $releasePath = Join-Path `
            $releaseRoot `
            $releaseName

          Write-Host ""
          Write-Host "Release Root:"
          Write-Host $releaseRoot

          Write-Host ""
          Write-Host "Release Name:"
          Write-Host $releaseName

          Write-Host ""
          Write-Host "Release Path:"
          Write-Host $releasePath

          if (-not (Test-Path $releaseRoot)) {

              New-Item `
                -ItemType Directory `
                -Path $releaseRoot `
                -Force | Out-Null
          }

          if (Test-Path $releasePath) {

              Remove-Item `
                $releasePath `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $releasePath `
            -Force | Out-Null

          Write-Host ""
          Write-Host "Release directory created successfully."

      # ============================================================
      # 5. COPY ARTIFACT TO RELEASE
      # ============================================================
      - name: Deploy application files
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Deploying BookMyHall Application"
          Write-Host "======================================"

          $artifactPath = Join-Path $env:RUNNER_TEMP "BookMyHall-publish"

          $releaseRoot = "C:\Websites\BookMyHall\releases"

          $runId = "${{ github.event.workflow_run.id }}"

          $releaseName = "release-$runId"

          $releasePath = Join-Path `
            $releaseRoot `
            $releaseName

          Write-Host ""
          Write-Host "Source:"
          Write-Host $artifactPath

          Write-Host ""
          Write-Host "Destination:"
          Write-Host $releasePath

          Copy-Item `
            "$artifactPath\*" `
            $releasePath `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "Application files copied successfully."

      # ============================================================
      # 6. VERIFY IIS
      # ============================================================
      - name: Verify IIS configuration
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Checking IIS"
          Write-Host "======================================"

          Import-Module WebAdministration

          $website = Get-Website `
            -Name "BookMyHall" `
            -ErrorAction SilentlyContinue

          if ($null -eq $website) {
              throw "IIS website 'BookMyHall' does not exist."
          }

          $appPool = Get-WebAppPoolState `
            -Name "BookMyHallAppPool" `
            -ErrorAction SilentlyContinue

          if ($null -eq $appPool) {
              throw "IIS AppPool 'BookMyHallAppPool' does not exist."
          }

          Write-Host ""
          Write-Host "Website:"
          Write-Host $website.Name

          Write-Host ""
          Write-Host "Current Physical Path:"
          Write-Host $website.PhysicalPath

          Write-Host ""
          Write-Host "Application Pool:"
          Write-Host "BookMyHallAppPool"

          Write-Host ""
          Write-Host "IIS configuration verified."

      # ============================================================
      # 7. STOP APP POOL
      # ============================================================
      - name: Stop BookMyHall AppPool
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Stopping BookMyHall AppPool"
          Write-Host "======================================"

          Import-Module WebAdministration

          $state = Get-WebAppPoolState `
            -Name "BookMyHallAppPool"

          if ($state.Value -eq "Started") {

              Stop-WebAppPool `
                -Name "BookMyHallAppPool"

              Start-Sleep `
                -Seconds 5
          }

          Write-Host ""
          Write-Host "AppPool stopped."

      # ============================================================
      # 8. SWITCH IIS TO NEW RELEASE
      # ============================================================
      - name: Switch IIS to new release
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Switching IIS to New Release"
          Write-Host "======================================"

          Import-Module WebAdministration

          $releaseRoot = "C:\Websites\BookMyHall\releases"

          $runId = "${{ github.event.workflow_run.id }}"

          $releaseName = "release-$runId"

          $releasePath = Join-Path `
            $releaseRoot `
            $releaseName

          Write-Host ""
          Write-Host "New IIS Physical Path:"
          Write-Host $releasePath

          if (-not (Test-Path $releasePath)) {
              throw "Release path does not exist: $releasePath"
          }

          Set-ItemProperty `
            "IIS:\Sites\BookMyHall" `
            -Name physicalPath `
            -Value $releasePath

          Write-Host ""
          Write-Host "IIS physical path updated successfully."

      # ============================================================
      # 9. START APP POOL
      # ============================================================
      - name: Start BookMyHall AppPool
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Starting BookMyHall AppPool"
          Write-Host "======================================"

          Import-Module WebAdministration

          Start-WebAppPool `
            -Name "BookMyHallAppPool"

          Start-Sleep `
            -Seconds 5

          $state = Get-WebAppPoolState `
            -Name "BookMyHallAppPool"

          Write-Host ""
          Write-Host "AppPool State:"
          Write-Host $state.Value

          if ($state.Value -ne "Started") {
              throw "BookMyHall AppPool failed to start."
          }

          Write-Host ""
          Write-Host "AppPool started successfully."

      # ============================================================
      # 10. VERIFY IIS PATH
      # ============================================================
      - name: Verify IIS deployment
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Verifying IIS Deployment"
          Write-Host "======================================"

          Import-Module WebAdministration

          $site = Get-Website `
            -Name "BookMyHall"

          $expectedPath = Join-Path `
            "C:\Websites\BookMyHall\releases" `
            "release-${{ github.event.workflow_run.id }}"

          Write-Host ""
          Write-Host "Expected:"
          Write-Host $expectedPath

          Write-Host ""
          Write-Host "Actual:"
          Write-Host $site.PhysicalPath

          $actualPath = $site.PhysicalPath.TrimEnd('\')
          $expectedPathNormalized = $expectedPath.TrimEnd('\')

          if ($actualPath -ne $expectedPathNormalized) {
              throw "IIS physical path does not match deployed release."
          }

          Write-Host ""
          Write-Host "IIS deployment verified successfully."

      # ============================================================
      # 11. HEALTH CHECK
      # ============================================================
      - name: Health check
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "BookMyHall Health Check"
          Write-Host "======================================"

          $healthUrl = "http://127.0.0.1:8065/health"

          Write-Host ""
          Write-Host "Health URL:"
          Write-Host $healthUrl

          $success = $false

          for ($i = 1; $i -le 12; $i++) {

              Write-Host ""
              Write-Host "Health check attempt $i of 12..."

              try {

                  $response = Invoke-WebRequest `
                    -Uri $healthUrl `
                    -UseBasicParsing `
                    -TimeoutSec 10

                  Write-Host ""
                  Write-Host "HTTP Status:"
                  Write-Host $response.StatusCode

                  if ($response.StatusCode -eq 200) {

                      $success = $true

                      Write-Host ""
                      Write-Host "Health check successful."

                      break
                  }
              }
              catch {

                  Write-Host ""
                  Write-Host "Application not ready yet."

                  Write-Host $_.Exception.Message
              }

              Start-Sleep `
                -Seconds 5
          }

          if (-not $success) {
              throw "BookMyHall health check failed."
          }

      # ============================================================
      # 12. CLEAN OLD RELEASES
      # ============================================================
      - name: Cleanup old releases
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Cleaning Old Releases"
          Write-Host "======================================"

          $releaseRoot = "C:\Websites\BookMyHall\releases"

          $currentRelease = "release-${{ github.event.workflow_run.id }}"

          $keep = 5

          $releases = @(
              Get-ChildItem `
                $releaseRoot `
                -Directory |
              Where-Object {
                  $_.Name -like "release-*"
              } |
              Sort-Object CreationTime -Descending
          )

          Write-Host ""
          Write-Host "Total releases:"
          Write-Host $releases.Count

          if ($releases.Count -gt $keep) {

              $oldReleases = $releases | Select-Object -Skip $keep

              foreach ($release in $oldReleases) {

                  if ($release.Name -eq $currentRelease) {
                      continue
                  }

                  Write-Host ""
                  Write-Host "Removing:"
                  Write-Host $release.FullName

                  Remove-Item `
                    $release.FullName `
                    -Recurse `
                    -Force
              }
          }

          Write-Host ""
          Write-Host "Release cleanup completed."

      # ============================================================
      # 13. FINAL SUMMARY
      # ============================================================
      - name: Deployment summary
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "BOOKMYHALL CD SUCCESS"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Application:"
          Write-Host "BookMyHall"

          Write-Host ""
          Write-Host "CI Run:"
          Write-Host "${{ github.event.workflow_run.id }}"

          Write-Host ""
          Write-Host "Release:"
          Write-Host "release-${{ github.event.workflow_run.id }}"

          Write-Host ""
          Write-Host "IIS Site:"
          Write-Host "BookMyHall"

          Write-Host ""
          Write-Host "App Pool:"
          Write-Host "BookMyHallAppPool"

          Write-Host ""
          Write-Host "Status:"
          Write-Host "DEPLOYMENT SUCCESSFUL"

          Write-Host ""
          Write-Host "======================================"