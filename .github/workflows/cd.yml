name: BookMyHall CD

on:
  workflow_run:
    workflows:
      - "BookMyHall CI"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy BookMyHall API
    runs-on:
      - self-hosted
      - Windows
      - X64

    # Deploy only when CI completed successfully.
    if: >
      github.event.workflow_run.conclusion == 'success'

    steps:

      # ============================================================
      # 1. DISPLAY DEPLOYMENT INFORMATION
      # ============================================================
      - name: Show deployment environment
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "BookMyHall CD Environment"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "User:"
          Write-Host $env:USERNAME

          Write-Host ""
          Write-Host "GitHub Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "Triggered CI Run:"
          Write-Host "${{ github.event.workflow_run.id }}"

          Write-Host ""
          Write-Host "CI Commit:"
          Write-Host "${{ github.event.workflow_run.head_sha }}"

          Write-Host ""
          Write-Host "======================================"

      # ============================================================
      # 2. DOWNLOAD CI ARTIFACT
      # ============================================================
      - name: Download BookMyHall publish artifact
        uses: actions/download-artifact@v4
        with:
          name: BookMyHall-publish
          path: deploy-package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # ============================================================
      # 3. VERIFY DOWNLOADED ARTIFACT
      # ============================================================
      - name: Verify deployment package
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Verifying Deployment Package"
          Write-Host "======================================"

          $packagePath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "deploy-package"

          if (-not (Test-Path $packagePath)) {
              throw "Deployment package not found: $packagePath"
          }

          Write-Host ""
          Write-Host "Package Path:"
          Write-Host $packagePath

          $requiredFiles = @(
              "BookMyHall.Api.dll",
              "BookMyHall.Api.exe",
              "web.config"
          )

          foreach ($file in $requiredFiles) {

              $filePath = Join-Path `
                $packagePath `
                $file

              if (-not (Test-Path $filePath)) {
                  throw "Required deployment file missing: $file"
              }

              Write-Host "Verified: $file"
          }

          Write-Host ""
          Write-Host "Deployment package is valid."

      # ============================================================
      # 4. DEFINE DEPLOYMENT VARIABLES
      # ============================================================
      - name: Configure deployment paths
        shell: powershell
        run: |
          # --------------------------------------------------------
          # CHANGE THIS PATH TO YOUR ACTUAL IIS APPLICATION PATH
          # --------------------------------------------------------

          $deployPath = "C:\inetpub\wwwroot\BookMyHall.Api"

          # Backup directory
          $backupRoot = "C:\Deployments\BookMyHall\Backups"

          # Create deployment directories
          New-Item `
            -ItemType Directory `
            -Path $deployPath `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path $backupRoot `
            -Force | Out-Null

          # Store paths for subsequent steps
          "BOOKMYHALL_DEPLOY_PATH=$deployPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "BOOKMYHALL_BACKUP_ROOT=$backupRoot" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "Deployment Path:"
          Write-Host $deployPath

          Write-Host ""
          Write-Host "Backup Path:"
          Write-Host $backupRoot

      # ============================================================
      # 5. STOP IIS APPLICATION
      # ============================================================
      - name: Stop IIS application
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Stopping IIS Application"
          Write-Host "======================================"

          $appPoolName = "BookMyHall.Api"

          Write-Host ""
          Write-Host "Application Pool:"
          Write-Host $appPoolName

          Import-Module WebAdministration

          if (Test-Path "IIS:\AppPools\$appPoolName") {

              $state = (Get-WebAppPoolState `
                -Name $appPoolName).Value

              Write-Host ""
              Write-Host "Current State: $state"

              if ($state -eq "Started") {

                  Stop-WebAppPool `
                    -Name $appPoolName

                  Write-Host ""
                  Write-Host "IIS Application Pool stopped."
              }
              else {

                  Write-Host ""
                  Write-Host "Application Pool is already stopped."
              }
          }
          else {

              Write-Host ""
              Write-Host "WARNING: Application Pool '$appPoolName' does not exist."

              Write-Host ""
              Write-Host "Continuing deployment..."
          }

      # ============================================================
      # 6. BACKUP CURRENT VERSION
      # ============================================================
      - name: Backup current deployment
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Backing Up Current Deployment"
          Write-Host "======================================"

          if (-not (Test-Path $env:BOOKMYHALL_DEPLOY_PATH)) {

              Write-Host ""
              Write-Host "No existing deployment found."
              Write-Host "Backup skipped."

              exit 0
          }

          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"

          $backupPath = Join-Path `
            $env:BOOKMYHALL_BACKUP_ROOT `
            $timestamp

          New-Item `
            -ItemType Directory `
            -Path $backupPath `
            -Force | Out-Null

          Write-Host ""
          Write-Host "Backup Path:"
          Write-Host $backupPath

          Copy-Item `
            -Path "$($env:BOOKMYHALL_DEPLOY_PATH)\*" `
            -Destination $backupPath `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Current deployment backed up successfully."

      # ============================================================
      # 7. PRESERVE CONFIGURATION
      # ============================================================
      - name: Preserve production configuration
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Preserving Production Configuration"
          Write-Host "======================================"

          $productionAppSettings = Join-Path `
            $env:BOOKMYHALL_DEPLOY_PATH `
            "appsettings.Production.json"

          if (Test-Path $productionAppSettings) {

              $tempConfig = Join-Path `
                $env:RUNNER_TEMP `
                "BookMyHall-appsettings.Production.json"

              Copy-Item `
                $productionAppSettings `
                $tempConfig `
                -Force

              "BOOKMYHALL_PRODUCTION_CONFIG=$tempConfig" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

              Write-Host ""
              Write-Host "Production configuration preserved."
          }
          else {

              Write-Host ""
              Write-Host "No appsettings.Production.json found."
              Write-Host "Continuing deployment."
          }

      # ============================================================
      # 8. DEPLOY NEW VERSION
      # ============================================================
      - name: Deploy BookMyHall API
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Deploying BookMyHall API"
          Write-Host "======================================"

          $packagePath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "deploy-package"

          Write-Host ""
          Write-Host "Source:"
          Write-Host $packagePath

          Write-Host ""
          Write-Host "Destination:"
          Write-Host $env:BOOKMYHALL_DEPLOY_PATH

          # Remove old deployment files.
          Get-ChildItem `
            -Path $env:BOOKMYHALL_DEPLOY_PATH `
            -Force |
            Remove-Item `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

          # Copy new deployment.
          Copy-Item `
            -Path "$packagePath\*" `
            -Destination $env:BOOKMYHALL_DEPLOY_PATH `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "BookMyHall API deployed successfully."

      # ============================================================
      # 9. RESTORE PRODUCTION CONFIGURATION
      # ============================================================
      - name: Restore production configuration
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Restoring Production Configuration"
          Write-Host "======================================"

          if ($env:BOOKMYHALL_PRODUCTION_CONFIG) {

              $destination = Join-Path `
                $env:BOOKMYHALL_DEPLOY_PATH `
                "appsettings.Production.json"

              if (Test-Path $env:BOOKMYHALL_PRODUCTION_CONFIG) {

                  Copy-Item `
                    $env:BOOKMYHALL_PRODUCTION_CONFIG `
                    $destination `
                    -Force

                  Write-Host ""
                  Write-Host "Production configuration restored."
              }
          }
          else {

              Write-Host ""
              Write-Host "No production configuration to restore."
          }

      # ============================================================
      # 10. START IIS APPLICATION
      # ============================================================
      - name: Start IIS application
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Starting IIS Application"
          Write-Host "======================================"

          $appPoolName = "BookMyHall.Api"

          Import-Module WebAdministration

          if (-not (Test-Path "IIS:\AppPools\$appPoolName")) {

              throw "IIS Application Pool '$appPoolName' does not exist."
          }

          Start-WebAppPool `
            -Name $appPoolName

          Start-Sleep `
            -Seconds 5

          $state = (Get-WebAppPoolState `
            -Name $appPoolName).Value

          Write-Host ""
          Write-Host "Application Pool State: $state"

          if ($state -ne "Started") {
              throw "IIS Application Pool failed to start."
          }

          Write-Host ""
          Write-Host "IIS application started successfully."

      # ============================================================
      # 11. VERIFY DEPLOYED FILES
      # ============================================================
      - name: Verify deployed API
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Verifying Deployment"
          Write-Host "======================================"

          $requiredFiles = @(
              "BookMyHall.Api.dll",
              "BookMyHall.Api.exe",
              "web.config"
          )

          foreach ($file in $requiredFiles) {

              $filePath = Join-Path `
                $env:BOOKMYHALL_DEPLOY_PATH `
                $file

              if (-not (Test-Path $filePath)) {
                  throw "Deployment verification failed. Missing: $file"
              }

              Write-Host "Verified: $file"
          }

          Write-Host ""
          Write-Host "Deployment files verified successfully."

      # ============================================================
      # 12. HEALTH CHECK
      # ============================================================
      - name: Health check
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "BookMyHall API Health Check"
          Write-Host "======================================"

          # --------------------------------------------------------
          # CHANGE THIS URL TO YOUR ACTUAL HEALTH ENDPOINT
          # Example:
          # https://api.bookmyhall.com/health
          # --------------------------------------------------------

          $healthUrl = "http://localhost/BookMyHall.Api/health"

          Write-Host ""
          Write-Host "Health URL:"
          Write-Host $healthUrl

          $maxAttempts = 12
          $success = $false

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {

              Write-Host ""
              Write-Host "Health check attempt $attempt of $maxAttempts"

              try {

                  $response = Invoke-WebRequest `
                    -Uri $healthUrl `
                    -Method Get `
                    -UseBasicParsing `
                    -TimeoutSec 10

                  Write-Host ""
                  Write-Host "HTTP Status:"
                  Write-Host $response.StatusCode

                  if ($response.StatusCode -eq 200) {

                      $success = $true

                      Write-Host ""
                      Write-Host "BookMyHall API is healthy."

                      break
                  }
              }
              catch {

                  Write-Host ""
                  Write-Host "Health check failed:"
                  Write-Host $_.Exception.Message
              }

              Start-Sleep `
                -Seconds 5
          }

          if (-not $success) {

              Write-Host ""
              Write-Host "======================================"
              Write-Host "HEALTH CHECK FAILED"
              Write-Host "======================================"

              throw "BookMyHall API health check failed."
          }

      # ============================================================
      # 13. DEPLOYMENT SUMMARY
      # ============================================================
      - name: Deployment summary
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "BOOKMYHALL CD SUCCESS"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "CI Run         : ${{ github.event.workflow_run.id }}"
          Write-Host "Commit         : ${{ github.event.workflow_run.head_sha }}"
          Write-Host "Environment    : Production"
          Write-Host "Server         : $env:COMPUTERNAME"
          Write-Host "Deployment     : SUCCESS"
          Write-Host "IIS            : SUCCESS"
          Write-Host "Health Check   : SUCCESS"

          Write-Host ""
          Write-Host "======================================"