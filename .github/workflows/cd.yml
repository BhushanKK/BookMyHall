name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: BookMyHall
          path: publish

      - name: Deploy
        shell: powershell
        run: |
          $release = "C:\Websites\BookMyHall\releases\$(Get-Date -Format yyyyMMdd-HHmmss)"

          New-Item -ItemType Directory -Force -Path $release

          Copy-Item ".\publish\*" $release -Recurse -Force

          if (Test-Path "C:\Websites\BookMyHall\current") {
              Remove-Item "C:\Websites\BookMyHall\current" -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path "C:\Websites\BookMyHall\current"

          Copy-Item "$release\*" "C:\Websites\BookMyHall\current" -Recurse -Force

          Restart-Service "BookMyHall"