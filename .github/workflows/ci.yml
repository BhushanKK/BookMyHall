name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure NuGet
        shell: powershell
        run: |
          dotnet nuget list source

          dotnet nuget remove source "nuget.org" --configfile "$env:RUNNER_TEMP\NuGet.Config" 2>$null

          dotnet nuget add source "https://api.nuget.org/v3/index.json" `
            --name "nuget.org" `
            --configfile "$env:RUNNER_TEMP\NuGet.Config"

          Write-Host "NuGet sources:"
          dotnet nuget list source --configfile "$env:RUNNER_TEMP\NuGet.Config"

      - name: Restore
        shell: powershell
        run: |
          dotnet restore BookMyHall.slnx `
            --configfile "$env:RUNNER_TEMP\NuGet.Config" `
            --verbosity minimal

      - name: Test
        run: dotnet test BookMyHall.slnx --no-restore

      - name: Publish
        run: dotnet publish src/BookMyHall.Api/BookMyHall.Api.csproj -c Release -o publish --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookMyHall
          path: publish