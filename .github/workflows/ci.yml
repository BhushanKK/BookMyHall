name: BookMyHall CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ============================================================
  # BUILD, TEST AND PUBLISH
  # ============================================================
  build-test-publish:

    name: Build, Test and Publish

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ========================================================
      # 2. SHOW ENVIRONMENT
      # ========================================================
      - name: Show environment
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "BookMyHall CI Environment"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "User:"
          Write-Host $env:USERNAME

          Write-Host ""
          Write-Host "GitHub Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "Current Directory:"
          Get-Location

          Write-Host ""
          Write-Host "======================================"
          Write-Host ".NET Information"
          Write-Host "======================================"

          dotnet --info

          Write-Host ""
          Write-Host "Installed SDKs:"
          dotnet --list-sdks

          Write-Host ""
          Write-Host "Installed Runtimes:"
          dotnet --list-runtimes

          Write-Host ""
          Write-Host "Git Version:"
          git --version

      # ========================================================
      # 3. VERIFY SOLUTION STRUCTURE
      # ========================================================
      - name: Verify solution structure
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Verifying BookMyHall Solution"
          Write-Host "======================================"

          $solution = Join-Path `
            $env:GITHUB_WORKSPACE `
            "BookMyHall.slnx"

          $project = Join-Path `
            $env:GITHUB_WORKSPACE `
            "src\BookMyHall.Api\BookMyHall.Api.csproj"

          Write-Host ""
          Write-Host "Solution:"
          Write-Host $solution

          Write-Host ""
          Write-Host "API Project:"
          Write-Host $project

          if (-not (Test-Path $solution)) {
              throw "Solution file not found: $solution"
          }

          if (-not (Test-Path $project)) {
              throw "API project not found: $project"
          }

          Write-Host ""
          Write-Host "Solution and API project found successfully."

      # ========================================================
      # 4. RESTORE
      # ========================================================
      - name: Restore NuGet packages
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Restoring NuGet Packages"
          Write-Host "======================================"

          $solution = Join-Path `
            $env:GITHUB_WORKSPACE `
            "BookMyHall.slnx"

          dotnet restore $solution

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet restore failed."
          }

          Write-Host ""
          Write-Host "NuGet restore completed successfully."

      # ========================================================
      # 5. BUILD
      # ========================================================
      - name: Build solution
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Building BookMyHall"
          Write-Host "======================================"

          $solution = Join-Path `
            $env:GITHUB_WORKSPACE `
            "BookMyHall.slnx"

          dotnet build $solution `
            --configuration Release `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet build failed."
          }

          Write-Host ""
          Write-Host "Build completed successfully."

      # ========================================================
      # 6. TEST
      # ========================================================
      - name: Run tests
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Running BookMyHall Tests"
          Write-Host "======================================"

          $solution = Join-Path `
            $env:GITHUB_WORKSPACE `
            "BookMyHall.slnx"

          dotnet test $solution `
            --configuration Release `
            --no-build `
            --verbosity normal

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet test failed."
          }

          Write-Host ""
          Write-Host "Test execution completed successfully."

      # ========================================================
      # 7. PREPARE PUBLISH DIRECTORY
      # ========================================================
      - name: Prepare publish directory
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Preparing Publish Directory"
          Write-Host "======================================"

          $publishPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish"

          Write-Host ""
          Write-Host "Publish Path:"
          Write-Host $publishPath

          if (Test-Path $publishPath) {

              Write-Host ""
              Write-Host "Removing previous publish directory..."

              Remove-Item `
                $publishPath `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $publishPath `
            -Force | Out-Null

          Write-Host ""
          Write-Host "Publish directory ready."

      # ========================================================
      # 8. PUBLISH API
      # ========================================================
      - name: Publish BookMyHall API
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Publishing BookMyHall API"
          Write-Host "======================================"

          $project = Join-Path `
            $env:GITHUB_WORKSPACE `
            "src\BookMyHall.Api\BookMyHall.Api.csproj"

          $publishPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish"

          Write-Host ""
          Write-Host "Project:"
          Write-Host $project

          Write-Host ""
          Write-Host "Publish Directory:"
          Write-Host $publishPath

          dotnet publish $project `
            --configuration Release `
            --no-restore `
            --output $publishPath

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet publish failed."
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Publish completed successfully"
          Write-Host "======================================"

      # ========================================================
      # 9. VERIFY PUBLISHED API
      # ========================================================
      - name: Verify published API
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Verifying Published API"
          Write-Host "======================================"

          $publishPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish"

          if (-not (Test-Path $publishPath)) {
              throw "Publish directory does not exist: $publishPath"
          }

          $apiDll = Join-Path `
            $publishPath `
            "BookMyHall.Api.dll"

          $apiExe = Join-Path `
            $publishPath `
            "BookMyHall.Api.exe"

          $webConfig = Join-Path `
            $publishPath `
            "web.config"

          $appSettings = Join-Path `
            $publishPath `
            "appsettings.json"

          Write-Host ""
          Write-Host "Checking:"
          Write-Host $apiDll
          Write-Host $apiExe
          Write-Host $webConfig
          Write-Host $appSettings

          if (-not (Test-Path $apiDll)) {
              throw "BookMyHall.Api.dll was not found."
          }

          if (-not (Test-Path $apiExe)) {
              throw "BookMyHall.Api.exe was not found."
          }

          if (-not (Test-Path $webConfig)) {
              throw "web.config was not found."
          }

          if (-not (Test-Path $appSettings)) {
              throw "appsettings.json was not found."
          }

          Write-Host ""
          Write-Host "All required publish files are present."

          Write-Host ""
          Write-Host "Published files:"

          Get-ChildItem `
            $publishPath `
            -Recurse |
            Select-Object FullName, Length

      # ========================================================
      # 10. UPLOAD ARTIFACT FOR CD
      # ========================================================
      - name: Upload BookMyHall publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookMyHall-publish
          path: ${{ github.workspace }}/publish
          if-no-files-found: error
          retention-days: 7

      # ========================================================
      # 11. VERIFY ARTIFACT
      # ========================================================
      - name: Verify CI artifact
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "CI Artifact Verification"
          Write-Host "======================================"

          $publishPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish"

          $requiredFiles = @(
              "BookMyHall.Api.dll",
              "BookMyHall.Api.exe",
              "web.config",
              "appsettings.json"
          )

          foreach ($file in $requiredFiles) {

              $filePath = Join-Path `
                $publishPath `
                $file

              if (-not (Test-Path $filePath)) {
                  throw "Required artifact file missing: $file"
              }

              Write-Host "Verified: $file"
          }

          Write-Host ""
          Write-Host "CI artifact verification successful."

      # ========================================================
      # 12. FINAL CI SUMMARY
      # ========================================================
      - name: CI Summary
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "BOOKMYHALL CI SUCCESS"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Checkout       : SUCCESS"
          Write-Host "Restore        : SUCCESS"
          Write-Host "Build          : SUCCESS"
          Write-Host "Tests          : SUCCESS"
          Write-Host "Publish        : SUCCESS"
          Write-Host "Artifact       : SUCCESS"
          Write-Host "Verification   : SUCCESS"

          Write-Host ""
          Write-Host "Artifact Name:"
          Write-Host "BookMyHall-publish"

          Write-Host ""
          Write-Host "BookMyHall API has been successfully"
          Write-Host "built, tested, published and uploaded."

          Write-Host ""
          Write-Host "======================================"