name: BookMyHall CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test-publish:
    name: Build, Test and Publish

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ============================================================
      # 2. SHOW ENVIRONMENT
      # ============================================================
      - name: Show environment
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "BookMyHall CI Environment"
          Write-Host "======================================"

          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "User:"
          Write-Host $env:USERNAME

          Write-Host ""
          Write-Host "GitHub Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "Current Directory:"
          Get-Location

          Write-Host ""
          Write-Host "======================================"
          Write-Host ".NET Information"
          Write-Host "======================================"

          dotnet --info

          Write-Host ""
          Write-Host "Installed SDKs:"
          dotnet --list-sdks

          Write-Host ""
          Write-Host "Installed Runtimes:"
          dotnet --list-runtimes

          Write-Host ""
          Write-Host "Git Version:"
          git --version

      # ============================================================
      # 3. VERIFY SOLUTION
      # ============================================================
      - name: Verify solution structure
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Verifying BookMyHall Solution"
          Write-Host "======================================"

          $solution = Join-Path $env:GITHUB_WORKSPACE "BookMyHall.slnx"
          $project = Join-Path $env:GITHUB_WORKSPACE "src\BookMyHall.Api\BookMyHall.Api.csproj"

          Write-Host "Solution:"
          Write-Host $solution

          Write-Host ""
          Write-Host "API Project:"
          Write-Host $project

          if (-not (Test-Path $solution)) {
              throw "Solution file not found: $solution"
          }

          if (-not (Test-Path $project)) {
              throw "API project not found: $project"
          }

          Write-Host ""
          Write-Host "Solution and API project found successfully."

      # ============================================================
      # 4. RESTORE
      # ============================================================
      - name: Restore NuGet packages
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Restoring NuGet Packages"
          Write-Host "======================================"

          $solution = Join-Path $env:GITHUB_WORKSPACE "BookMyHall.slnx"

          dotnet restore $solution

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet restore failed."
          }

          Write-Host ""
          Write-Host "NuGet restore completed successfully."

      # ============================================================
      # 5. BUILD
      # ============================================================
      - name: Build solution
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Building BookMyHall"
          Write-Host "======================================"

          $solution = Join-Path $env:GITHUB_WORKSPACE "BookMyHall.slnx"

          dotnet build $solution `
            --configuration Release `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet build failed."
          }

          Write-Host ""
          Write-Host "Build completed successfully."

      # ============================================================
      # 6. TEST
      # ============================================================
      - name: Run tests
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Running BookMyHall Tests"
          Write-Host "======================================"

          $solution = Join-Path $env:GITHUB_WORKSPACE "BookMyHall.slnx"

          dotnet test $solution `
            --configuration Release `
            --no-build `
            --verbosity normal

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet test failed."
          }

          Write-Host ""
          Write-Host "Test execution completed successfully."
          Write-Host ""
          Write-Host "Note:"
          Write-Host "Application.Tests and Api.Tests currently contain"
          Write-Host "no test cases. They will be implemented later."

      # ============================================================
      # 7. PUBLISH
      # ============================================================
      - name: Publish BookMyHall API
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Publishing BookMyHall API"
          Write-Host "======================================"

          $project = Join-Path $env:GITHUB_WORKSPACE "src\BookMyHall.Api\BookMyHall.Api.csproj"
          $publishPath = Join-Path $env:GITHUB_WORKSPACE "publish"

          Write-Host "Project:"
          Write-Host $project

          Write-Host ""
          Write-Host "Publish Directory:"
          Write-Host $publishPath

          if (-not (Test-Path $project)) {
              throw "BookMyHall.Api.csproj not found: $project"
          }

          # Remove previous publish directory
          if (Test-Path $publishPath) {
              Write-Host ""
              Write-Host "Removing previous publish directory..."

              Remove-Item `
                $publishPath `
                -Recurse `
                -Force
          }

          # Publish API
          dotnet publish $project `
            --configuration Release `
            --no-restore `
            --output $publishPath

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet publish failed."
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Publish completed successfully"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Published files:"

          Get-ChildItem $publishPath -Recurse |
            Select-Object FullName, Length

      # ============================================================
      # 8. VERIFY PUBLISHED API
      # ============================================================
      - name: Verify published API
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Verifying Published API"
          Write-Host "======================================"

          $publishPath = Join-Path $env:GITHUB_WORKSPACE "publish"

          $apiDll = Join-Path $publishPath "BookMyHall.Api.dll"
          $apiExe = Join-Path $publishPath "BookMyHall.Api.exe"
          $webConfig = Join-Path $publishPath "web.config"
          $appSettings = Join-Path $publishPath "appsettings.json"

          Write-Host "Checking:"
          Write-Host $apiDll
          Write-Host $apiExe
          Write-Host $webConfig
          Write-Host $appSettings

          if (-not (Test-Path $apiDll)) {
              throw "BookMyHall.Api.dll was not found."
          }

          if (-not (Test-Path $apiExe)) {
              throw "BookMyHall.Api.exe was not found."
          }

          if (-not (Test-Path $webConfig)) {
              throw "web.config was not found."
          }

          if (-not (Test-Path $appSettings)) {
              throw "appsettings.json was not found."
          }

          Write-Host ""
          Write-Host "All required publish files are present."

      # ============================================================
      # 9. FINAL SUMMARY
      # ============================================================
      - name: CI Summary
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "BOOKMYHALL CI SUCCESS"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Checkout       : SUCCESS"
          Write-Host "Restore        : SUCCESS"
          Write-Host "Build          : SUCCESS"
          Write-Host "Tests          : SUCCESS"
          Write-Host "Publish        : SUCCESS"
          Write-Host "Verification   : SUCCESS"

          Write-Host ""
          Write-Host "BookMyHall API has been successfully built and published."

          Write-Host ""
          Write-Host "Publish location:"
          Write-Host (Join-Path $env:GITHUB_WORKSPACE "publish")

          Write-Host ""
          Write-Host "======================================"