name: BookMyHall CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build-test-publish:

    name: Build, Test and Publish

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ============================================================
      # 2. SHOW ENVIRONMENT
      # ============================================================
      - name: Show environment
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "BookMyHall CI Environment"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "User:"
          Write-Host $env:USERNAME

          Write-Host ""
          Write-Host "GitHub Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "Current Directory:"
          Get-Location

          Write-Host ""
          Write-Host "======================================"
          Write-Host ".NET Information"
          Write-Host "======================================"

          dotnet --info

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to execute dotnet --info."
          }

          Write-Host ""
          Write-Host "Installed SDKs:"
          dotnet --list-sdks

          Write-Host ""
          Write-Host "Installed Runtimes:"
          dotnet --list-runtimes

          Write-Host ""
          Write-Host "Git Version:"
          git --version

      # ============================================================
      # 3. VERIFY SOLUTION STRUCTURE
      # ============================================================
      - name: Verify solution structure
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Verifying BookMyHall Solution"
          Write-Host "======================================"

          $solution = Join-Path `
            $env:GITHUB_WORKSPACE `
            "BookMyHall.slnx"

          $project = Join-Path `
            $env:GITHUB_WORKSPACE `
            "src\BookMyHall.Api\BookMyHall.Api.csproj"

          $packagesProps = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Directory.Packages.props"

          Write-Host ""
          Write-Host "Solution:"
          Write-Host $solution

          Write-Host ""
          Write-Host "API Project:"
          Write-Host $project

          Write-Host ""
          Write-Host "Central Package Management:"
          Write-Host $packagesProps

          if (-not (Test-Path $solution)) {
              throw "Solution file not found: $solution"
          }

          if (-not (Test-Path $project)) {
              throw "API project not found: $project"
          }

          if (-not (Test-Path $packagesProps)) {
              throw "Directory.Packages.props not found: $packagesProps"
          }

          Write-Host ""
          Write-Host "Solution:"
          Write-Host "  FOUND"

          Write-Host "API Project:"
          Write-Host "  FOUND"

          Write-Host "Directory.Packages.props:"
          Write-Host "  FOUND"

      # ============================================================
      # 4. DISPLAY CENTRAL PACKAGE MANAGEMENT
      # ============================================================
      - name: Display package management configuration
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Directory.Packages.props"
          Write-Host "======================================"

          $packagesProps = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Directory.Packages.props"

          Get-Content $packagesProps

      # ============================================================
      # 5. CLEAR NUGET CACHE
      # ============================================================
      #
      # IMPORTANT:
      # The runner is self-hosted and persistent.
      # Clearing the NuGet cache prevents stale package state.
      #
      # ============================================================
      - name: Clear NuGet cache
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Clearing NuGet Cache"
          Write-Host "======================================"

          dotnet nuget locals all --clear

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to clear NuGet cache."
          }

          Write-Host ""
          Write-Host "NuGet cache cleared successfully."

      # ============================================================
      # 6. RESTORE
      # ============================================================
      - name: Restore NuGet packages
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Restoring NuGet Packages"
          Write-Host "======================================"

          $solution = Join-Path `
            $env:GITHUB_WORKSPACE `
            "BookMyHall.slnx"

          dotnet restore $solution `
            --force `
            --no-cache

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet restore failed."
          }

          Write-Host ""
          Write-Host "NuGet restore completed successfully."

      # ============================================================
      # 7. VERIFY OPENAPI / SWAGGER PACKAGES
      # ============================================================
      - name: Verify OpenAPI package versions
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "OpenAPI / Swagger Package Versions"
          Write-Host "======================================"

          $project = Join-Path `
            $env:GITHUB_WORKSPACE `
            "src\BookMyHall.Api\BookMyHall.Api.csproj"

          dotnet list $project package --include-transitive |
            Select-String `
              "Microsoft.OpenApi|Swashbuckle|Microsoft.AspNetCore.OpenApi"

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to inspect OpenAPI packages."
          }

      # ============================================================
      # 8. VERIFY MICROSOFT.OPENAPI DEPENDENCY GRAPH
      # ============================================================
      - name: Verify Microsoft.OpenApi dependency graph
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Microsoft.OpenApi Dependency Graph"
          Write-Host "======================================"

          $project = Join-Path `
            $env:GITHUB_WORKSPACE `
            "src\BookMyHall.Api\BookMyHall.Api.csproj"

          dotnet nuget why `
            $project `
            Microsoft.OpenApi

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to determine Microsoft.OpenApi dependency graph."
          }

      # ============================================================
      # 9. SECURITY / VULNERABILITY SCAN
      # ============================================================
      - name: Check vulnerable NuGet packages
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "NuGet Vulnerability Scan"
          Write-Host "======================================"

          $project = Join-Path `
            $env:GITHUB_WORKSPACE `
            "src\BookMyHall.Api\BookMyHall.Api.csproj"

          dotnet list `
            $project `
            package `
            --vulnerable `
            --include-transitive

          if ($LASTEXITCODE -ne 0) {
              throw "NuGet vulnerability scan failed."
          }

          Write-Host ""
          Write-Host "NuGet vulnerability scan completed."

      # ============================================================
      # 10. BUILD
      # ============================================================
      - name: Build solution
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Building BookMyHall"
          Write-Host "======================================"

          $solution = Join-Path `
            $env:GITHUB_WORKSPACE `
            "BookMyHall.slnx"

          dotnet build $solution `
            --configuration Release `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet build failed."
          }

          Write-Host ""
          Write-Host "Build completed successfully."

      # ============================================================
      # 11. TEST
      # ============================================================
      - name: Run tests
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Running BookMyHall Tests"
          Write-Host "======================================"

          $solution = Join-Path `
            $env:GITHUB_WORKSPACE `
            "BookMyHall.slnx"

          dotnet test $solution `
            --configuration Release `
            --no-build `
            --verbosity normal

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet test failed."
          }

          Write-Host ""
          Write-Host "Test execution completed successfully."

      # ============================================================
      # 12. PREPARE PUBLISH DIRECTORY
      # ============================================================
      - name: Prepare publish directory
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Preparing Publish Directory"
          Write-Host "======================================"

          $publishPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish"

          if (Test-Path $publishPath) {
              Write-Host "Removing existing publish directory..."

              Remove-Item `
                $publishPath `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $publishPath `
            -Force | Out-Null

          Write-Host ""
          Write-Host "Publish directory:"
          Write-Host $publishPath

      # ============================================================
      # 13. PUBLISH API
      # ============================================================
      - name: Publish BookMyHall API
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Publishing BookMyHall API"
          Write-Host "======================================"

          $project = Join-Path `
            $env:GITHUB_WORKSPACE `
            "src\BookMyHall.Api\BookMyHall.Api.csproj"

          $publishPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish"

          dotnet publish $project `
            --configuration Release `
            --no-restore `
            --output $publishPath

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet publish failed."
          }

          Write-Host ""
          Write-Host "Publish completed successfully."

      # ============================================================
      # 14. VERIFY PUBLISH
      # ============================================================
      - name: Verify published API
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Verifying Published API"
          Write-Host "======================================"

          $publishPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "publish"

          if (-not (Test-Path $publishPath)) {
              throw "Publish directory does not exist: $publishPath"
          }

          $requiredFiles = @(
              "BookMyHall.Api.dll",
              "BookMyHall.Api.exe",
              "web.config",
              "appsettings.json"
          )

          foreach ($file in $requiredFiles) {

              $filePath = Join-Path `
                $publishPath `
                $file

              if (-not (Test-Path $filePath)) {
                  throw "Required publish file missing: $file"
              }

              Write-Host "Verified: $file"
          }

          Write-Host ""
          Write-Host "Published files:"
          Write-Host "--------------------------------------"

          Get-ChildItem `
            $publishPath `
            -Recurse |
            Select-Object FullName, Length

      # ============================================================
      # 15. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload BookMyHall publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookMyHall-publish
          path: publish
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 16. FINAL SUMMARY
      # ============================================================
      - name: CI Summary
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "BOOKMYHALL CI SUCCESS"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Checkout       : SUCCESS"
          Write-Host "Environment    : SUCCESS"
          Write-Host "Restore        : SUCCESS"
          Write-Host "OpenAPI Check  : SUCCESS"
          Write-Host "Security Scan  : SUCCESS"
          Write-Host "Build          : SUCCESS"
          Write-Host "Tests          : SUCCESS"
          Write-Host "Publish        : SUCCESS"
          Write-Host "Artifact       : SUCCESS"

          Write-Host ""
          Write-Host "Artifact:"
          Write-Host "BookMyHall-publish"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "BookMyHall CI pipeline completed."
          Write-Host "======================================"