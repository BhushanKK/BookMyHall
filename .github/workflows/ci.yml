name: BookMyHall CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ============================================================
  # BUILD + TEST
  # ============================================================
  build-and-test:

    name: Build and Test

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:

      # --------------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Show environment
      # --------------------------------------------------------
      - name: Show environment
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "BookMyHall CI/CD"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "User:"
          Write-Host $env:USERNAME

          Write-Host ""
          Write-Host "Current Directory:"
          Get-Location

          Write-Host ""
          Write-Host ".NET Information:"
          dotnet --info

      # --------------------------------------------------------
      # 3. Restore
      # --------------------------------------------------------
      - name: Restore dependencies
        shell: powershell
        run: |
          dotnet restore .\BookMyHall.slnx

      # --------------------------------------------------------
      # 4. Build
      # --------------------------------------------------------
      - name: Build solution
        shell: powershell
        run: |
          dotnet build .\BookMyHall.slnx `
            --configuration Release `
            --no-restore

      # --------------------------------------------------------
      # 5. Test
      # --------------------------------------------------------
      - name: Run tests
        shell: powershell
        run: |
          dotnet test .\BookMyHall.slnx `
            --configuration Release `
            --no-build `
            --verbosity normal

  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:

    name: Deploy to IIS

    needs: build-and-test

    # Deploy ONLY after push to main.
    # Pull requests should build/test but should NOT deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:

      # --------------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Publish
      # --------------------------------------------------------
      - name: Publish BookMyHall API
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "Publishing BookMyHall API"
          Write-Host "======================================"

          if (Test-Path ".\publish") {
              Remove-Item ".\publish" -Recurse -Force
          }

          dotnet publish .\src\BookMyHall.Api\BookMyHall.Api.csproj `
            --configuration Release `
            --output ".\publish" `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet publish failed."
          }

          Write-Host ""
          Write-Host "Published files:"
          Get-ChildItem ".\publish"

      # --------------------------------------------------------
      # 3. Create release directory
      # --------------------------------------------------------
      - name: Create release
        shell: powershell
        run: |

          $deploymentRoot = "C:\Websites\BookMyHall"
          $releasesRoot = "$deploymentRoot\releases"

          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"

          $releasePath = "$releasesRoot\$timestamp"

          Write-Host "Deployment Root:"
          Write-Host $deploymentRoot

          Write-Host ""
          Write-Host "Release:"
          Write-Host $releasePath

          New-Item `
            -ItemType Directory `
            -Path $releasePath `
            -Force | Out-Null

          Copy-Item `
            ".\publish\*" `
            $releasePath `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "Release created successfully."

          Write-Host ""
          Write-Host "Release contents:"
          Get-ChildItem $releasePath

          # Store release path for next steps
          "RELEASE_PATH=$releasePath" >> $env:GITHUB_ENV

      # --------------------------------------------------------
      # 4. Stop IIS App Pool
      # --------------------------------------------------------
      - name: Stop BookMyHall AppPool
        shell: powershell
        run: |

          Write-Host "Stopping BookMyHall AppPool..."

          Import-Module WebAdministration

          if ((Get-WebAppPoolState "BookMyHallAppPool").Value -eq "Started") {

              Stop-WebAppPool "BookMyHallAppPool"

              Start-Sleep -Seconds 3
          }

          Write-Host "AppPool stopped."

      # --------------------------------------------------------
      # 5. Update IIS physical path
      # --------------------------------------------------------
      - name: Update IIS application path
        shell: powershell
        run: |

          Import-Module WebAdministration

          $releasePath = $env:RELEASE_PATH

          Write-Host "New release:"
          Write-Host $releasePath

          Set-ItemProperty `
            "IIS:\Sites\BookMyHall" `
            -Name physicalPath `
            -Value $releasePath

          Write-Host "IIS path updated."

      # --------------------------------------------------------
      # 6. Start IIS App Pool
      # --------------------------------------------------------
      - name: Start BookMyHall AppPool
        shell: powershell
        run: |

          Import-Module WebAdministration

          Start-WebAppPool "BookMyHallAppPool"

          Start-Sleep -Seconds 5

          $state = (Get-WebAppPoolState "BookMyHallAppPool").Value

          Write-Host "BookMyHall AppPool State: $state"

          if ($state -ne "Started") {
              throw "BookMyHall AppPool failed to start."
          }

      # --------------------------------------------------------
      # 7. Verify deployment
      # --------------------------------------------------------
      - name: Verify deployment
        shell: powershell
        run: |

          $releasePath = $env:RELEASE_PATH

          Write-Host "======================================"
          Write-Host "Deployment Verification"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Release:"
          Write-Host $releasePath

          Write-Host ""
          Write-Host "BookMyHall API DLL:"

          Get-Item "$releasePath\BookMyHall.Api.dll" |
            Select-Object Name, LastWriteTime, Length

          Write-Host ""
          Write-Host "IIS Site:"

          & "$env:windir\system32\inetsrv\appcmd.exe" `
            list site "BookMyHall" /config

      # --------------------------------------------------------
      # 8. Test OpenAPI
      # --------------------------------------------------------
      - name: Test BookMyHall API
        shell: powershell
        run: |

          Start-Sleep -Seconds 5

          Write-Host "Testing BookMyHall API..."

          try {

              $response = Invoke-WebRequest `
                "http://localhost:8065/openapi/v1.json" `
                -UseBasicParsing `
                -TimeoutSec 30

              Write-Host ""
              Write-Host "HTTP Status:"
              Write-Host $response.StatusCode

              if ($response.StatusCode -ne 200) {
                  throw "OpenAPI endpoint returned HTTP $($response.StatusCode)"
              }

              Write-Host ""
              Write-Host "BookMyHall API is responding successfully."

          }
          catch {

              Write-Host ""
              Write-Host "API verification failed."
              Write-Host $_

              throw
          }
