name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BookMyHall.slnx --source https://api.nuget.org/v3/index.json

      - name: Test
        run: dotnet test BookMyHall.slnx --no-restore

      - name: Publish
        run: dotnet publish src/BookMyHall.Api/BookMyHall.Api.csproj -c Release -o publish --no-restore

      - name: Deploy to IIS
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $releaseRoot = "C:\Websites\BookMyHall\releases"
          $current = "C:\Websites\BookMyHall\current"
          $appPool = "BookMyLawns"
          $websiteName = "ApiBookMyLawns"

          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $release = Join-Path $releaseRoot $timestamp

          Write-Host "======================================"
          Write-Host "BookMyHall Deployment"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Release:"
          Write-Host $release

          Import-Module WebAdministration

          Write-Host ""
          Write-Host "Validating IIS Application Pool..."

          if (-not (Test-Path "IIS:\AppPools\$appPool")) {
              throw "IIS Application Pool '$appPool' does not exist."
          }

          Write-Host "IIS Application Pool found:"
          Write-Host $appPool

          Write-Host ""
          Write-Host "Validating IIS Website..."

          $website = Get-Website -Name $websiteName -ErrorAction SilentlyContinue

          if ($null -eq $website) {
              throw "IIS Website '$websiteName' does not exist."
          }

          Write-Host "IIS Website found:"
          Write-Host "Name: $($website.Name)"
          Write-Host "State: $($website.State)"
          Write-Host "Physical Path: $($website.PhysicalPath)"
          Write-Host "Application Pool: $($website.ApplicationPool)"

          if ($website.ApplicationPool -ne $appPool) {
              throw "IIS Website '$websiteName' is using application pool '$($website.ApplicationPool)' instead of '$appPool'."
          }

          if ($website.PhysicalPath -ne $current) {
              throw "IIS Physical Path is '$($website.PhysicalPath)' but expected '$current'."
          }

          Write-Host ""
          Write-Host "Creating release directory..."

          New-Item `
            -ItemType Directory `
            -Path $release `
            -Force | Out-Null

          Write-Host ""
          Write-Host "Copying published application..."

          Copy-Item `
            ".\publish\*" `
            $release `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "Application copied to release successfully."

          Write-Host ""
          Write-Host "Stopping IIS Application Pool..."

          $poolState = (Get-WebAppPoolState -Name $appPool).Value

          if ($poolState -eq "Started") {
              Stop-WebAppPool -Name $appPool
              Start-Sleep -Seconds 3
          }

          $poolState = (Get-WebAppPoolState -Name $appPool).Value

          Write-Host "Application Pool status:"
          Write-Host $poolState

          if ($poolState -ne "Stopped") {
              throw "IIS Application Pool '$appPool' could not be stopped."
          }

          Write-Host ""
          Write-Host "Updating current deployment..."

          if (Test-Path $current) {
              Remove-Item `
                $current `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $current `
            -Force | Out-Null

          Copy-Item `
            "$release\*" `
            $current `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "Current deployment updated."

          Write-Host ""
          Write-Host "Verifying deployment files..."

          $apiExe = Join-Path $current "BookMyHall.Api.exe"
          $webConfig = Join-Path $current "web.config"

          if (-not (Test-Path $apiExe)) {
              throw "BookMyHall.Api.exe was not found in current deployment."
          }

          if (-not (Test-Path $webConfig)) {
              throw "web.config was not found in current deployment."
          }

          Write-Host "Deployment files verified."
          Write-Host "API:"
          Write-Host $apiExe
          Write-Host "Web.config:"
          Write-Host $webConfig

          Write-Host ""
          Write-Host "Starting IIS Application Pool..."

          Start-WebAppPool -Name $appPool

          Start-Sleep -Seconds 5

          $poolState = (Get-WebAppPoolState -Name $appPool).Value

          Write-Host ""
          Write-Host "Application Pool status:"
          Write-Host $poolState

          if ($poolState -ne "Started") {
              throw "IIS Application Pool '$appPool' failed to start."
          }

          Write-Host ""
          Write-Host "Verifying IIS Website..."

          $website = Get-Website -Name $websiteName -ErrorAction SilentlyContinue

          if ($null -eq $website) {
              throw "IIS Website '$websiteName' was not found after deployment."
          }

          Write-Host ""
          Write-Host "IIS Website:"
          Write-Host $website.Name

          Write-Host "Website State:"
          Write-Host $website.State

          Write-Host "Physical Path:"
          Write-Host $website.PhysicalPath

          Write-Host "Application Pool:"
          Write-Host $website.ApplicationPool

          if ($website.PhysicalPath -ne $current) {
              throw "IIS Physical Path is '$($website.PhysicalPath)' but expected '$current'."
          }

          if ($website.ApplicationPool -ne $appPool) {
              throw "IIS Website '$websiteName' is using application pool '$($website.ApplicationPool)' instead of '$appPool'."
          }

          if ($website.State -ne "Started") {
              Write-Host ""
              Write-Host "IIS Website is stopped. Starting website..."

              Start-Website -Name $websiteName

              Start-Sleep -Seconds 3

              $website = Get-Website -Name $websiteName
          }

          if ($website.State -ne "Started") {
              throw "IIS Website '$websiteName' is not running."
          }

          Write-Host ""
          Write-Host "IIS Website '$websiteName' is running successfully."

          Write-Host ""
          Write-Host "Cleaning old releases..."

          if (Test-Path $releaseRoot) {

              $releases = Get-ChildItem `
                -Path $releaseRoot `
                -Directory |
                Where-Object {
                    $_.Name -match '^\d{8}-\d{6}$'
                } |
                Sort-Object Name -Descending

              Write-Host ""
              Write-Host "Existing releases:"

              foreach ($item in $releases) {
                  Write-Host "  $($item.Name)"
              }

              $releasesToKeep = $releases | Select-Object -First 2

              $releasesToDelete = $releases | Select-Object -Skip 2

              foreach ($oldRelease in $releasesToDelete) {

                  Write-Host ""
                  Write-Host "Removing old release:"
                  Write-Host $oldRelease.FullName

                  try {

                      Remove-Item `
                        $oldRelease.FullName `
                        -Recurse `
                        -Force `
                        -ErrorAction Stop

                      Write-Host "Removed successfully."
                  }
                  catch {

                      Write-Warning `
                        "Could not remove release '$($oldRelease.FullName)': $($_.Exception.Message)"
                  }
              }

              Write-Host ""
              Write-Host "Releases retained:"

              foreach ($releaseToKeep in $releasesToKeep) {
                  Write-Host "  $($releaseToKeep.Name)"
              }
          }

          Write-Host ""
          Write-Host "Cleaning deployment junk files..."

          $junkPatterns = @(
              "*.tmp",
              "*.temp",
              "*.bak",
              "*.old",
              "*~",
              ".DS_Store",
              "Thumbs.db"
          )

          foreach ($pattern in $junkPatterns) {

              Get-ChildItem `
                -Path $releaseRoot `
                -Recurse `
                -File `
                -Filter $pattern `
                -ErrorAction SilentlyContinue |
                ForEach-Object {

                    try {

                        Write-Host "Removing junk file:"
                        Write-Host $_.FullName

                        Remove-Item `
                          $_.FullName `
                          -Force `
                          -ErrorAction Stop
                    }
                    catch {

                        Write-Warning `
                          "Could not remove junk file '$($_.FullName)': $($_.Exception.Message)"
                    }
                }
          }

          Write-Host ""
          Write-Host "Remaining releases:"

          Get-ChildItem `
            -Path $releaseRoot `
            -Directory |
            Where-Object {
                $_.Name -match '^\d{8}-\d{6}$'
            } |
            Sort-Object Name -Descending |
            ForEach-Object {
                Write-Host "  $($_.Name)"
            }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "DEPLOYMENT SUCCESSFUL!!!"
          Write-Host "======================================"